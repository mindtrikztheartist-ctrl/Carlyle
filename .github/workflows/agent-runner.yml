name: Run Autonomous Agent

on:
  schedule:
      - cron: '0 * * * *'
        workflow_dispatch:

        jobs:
          run-agent:
              runs-on: ubuntu-latest
                  steps:
                        - name: Check out repo code
                                uses: actions/checkout@v4

                                      - name: Set up Node.js
                                              uses: actions/setup-node@v4
                                                      with:
                                                                node-version: '20'

                                                                      - name: Run Agent Script
                                                                              run: node agent.js
                                                                              
